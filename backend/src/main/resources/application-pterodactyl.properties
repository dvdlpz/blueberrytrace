# Pterodactyl: React is bundled into the same Spring Boot JAR, so API and UI share one origin.
# Values marked with ${...} must come from the server environment or from
# /home/container/config/application-pterodactyl.properties.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.address=0.0.0.0
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.min-response-size=1024
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}
server.servlet.session.cookie.name=BLUEBERRYTRACESESSION
server.servlet.session.cookie.http-only=true
# A direct IP:port allocation is HTTP by default. Set COOKIE_SECURE=true only after a HTTPS reverse proxy/domain is active.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}

blueberrytrace.security.cookie-secure=${COOKIE_SECURE:false}
# Keep blank when frontend and API are bundled on the same origin. Add a specific HTTPS origin only for a separate UI origin.
blueberrytrace.api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
logging.level.root=WARN
logging.level.com.keraune.vlvblueberrysystem=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
