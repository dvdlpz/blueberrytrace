spring.application.name=vlv-blueberry-system
spring.profiles.default=local

spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Lima
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

blueberrytrace.profile-image.max-bytes=${PROFILE_IMAGE_MAX_BYTES:1000000}
blueberrytrace.security.allowed-email-domains=${ALLOWED_EMAIL_DOMAINS:}
blueberrytrace.bootstrap-admin.enabled=${BLUEBERRYTRACE_BOOTSTRAP_ADMIN_ENABLED:false}
blueberrytrace.bootstrap-admin.username=${BLUEBERRYTRACE_BOOTSTRAP_ADMIN_USERNAME:}
blueberrytrace.bootstrap-admin.email=${BLUEBERRYTRACE_BOOTSTRAP_ADMIN_EMAIL:}
blueberrytrace.bootstrap-admin.password=${BLUEBERRYTRACE_BOOTSTRAP_ADMIN_PASSWORD:}
blueberrytrace.bootstrap-admin.full-name=${BLUEBERRYTRACE_BOOTSTRAP_ADMIN_FULL_NAME:}
blueberrytrace.bootstrap-admin.position=${BLUEBERRYTRACE_BOOTSTRAP_ADMIN_POSITION:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

blueberrytrace.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
blueberrytrace.security.login.window-seconds=${LOGIN_WINDOW_SECONDS:900}
