# Desarrollo local. Copia backend/.env.example a backend/.env o exporta las variables antes de ejecutar.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vlv_blueberry_system?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:blueberrytrace}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}
server.servlet.session.cookie.name=BLUEBERRYTRACESESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

blueberrytrace.security.cookie-secure=false
blueberrytrace.api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
logging.level.com.keraune.vlvblueberrysystem=${APP_LOG_LEVEL:INFO}

# Desarrollo local: Hibernate puede crear una base vacía; activa Flyway solo sobre una base inicializada o heredada después de realizar un backup.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# MariaDB local compatibility. The MySQL Connector metadata query for reserved words is not
# compatible with MariaDB 12; Hibernate must not infer the database dialect from JDBC metadata.
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.MariaDBDialect}
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=${HIBERNATE_ALLOW_JDBC_METADATA_ACCESS:false}
spring.jpa.properties.jakarta.persistence.database-product-name=${JPA_DATABASE_PRODUCT_NAME:MariaDB}
spring.jpa.properties.jakarta.persistence.database-product-version=${JPA_DATABASE_PRODUCT_VERSION:12.3}
