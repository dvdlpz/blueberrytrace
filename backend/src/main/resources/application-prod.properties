# Producción: no hay valores por defecto para credenciales ni para la URL de MySQL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}
server.servlet.session.cookie.name=BLUEBERRYTRACESESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict

blueberrytrace.security.cookie-secure=${COOKIE_SECURE:true}
blueberrytrace.api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
logging.level.root=WARN
logging.level.com.keraune.vlvblueberrysystem=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN

# Flyway is the source of schema evolution. Existing installations are baselined at 0, then V1+ migrations apply.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.url=${DB_URL}
spring.flyway.user=${FLYWAY_USERNAME}
spring.flyway.password=${FLYWAY_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
