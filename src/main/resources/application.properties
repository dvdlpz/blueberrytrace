spring.application.name=vlv-blueberry-system

# =========================================
# MYSQL
# =========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vlv_blueberry_system?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / HIBERNATE
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================================
# THYMELEAF
# =========================================
spring.thymeleaf.cache=false

# =========================================
# SERVER
# =========================================
server.port=${SERVER_PORT:8080}
