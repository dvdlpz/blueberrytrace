<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Auditoría')}"></head>
<body class="app-body">
<div class="app-shell">
    <aside th:replace="~{fragments/app-shell :: sidebar('auditoria')}"></aside>
    <main class="main-content">
        <header th:replace="~{fragments/app-shell :: topbar('Auditoría del sistema', 'Consulta de acciones relevantes registradas en BlueberryTrace')}"></header>

        <section class="card clean-card">
            <div class="section-heading">
                <div>
                    <span class="section-kicker">Control interno</span>
                    <h2>Últimas acciones registradas</h2>
                </div>
                <p class="muted">Esta vista permite evidenciar el seguimiento de acciones críticas del sistema.</p>
            </div>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Usuario</th>
                        <th>Módulo</th>
                        <th>Acción</th>
                        <th>Descripción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(auditorias)}">
                        <td colspan="5">Aún no existen acciones registradas.</td>
                    </tr>
                    <tr th:each="auditoria : ${auditorias}">
                        <td th:text="${#temporals.format(auditoria.fechaHora, 'dd/MM/yyyy HH:mm')}">01/01/2026 08:00</td>
                        <td th:text="${auditoria.usuario != null ? auditoria.usuario.nombreCompleto : 'Sistema'}">Usuario</td>
                        <td th:text="${auditoria.modulo}">Módulo</td>
                        <td th:text="${auditoria.accion}">Acción</td>
                        <td th:text="${auditoria.descripcion}">Descripción</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
